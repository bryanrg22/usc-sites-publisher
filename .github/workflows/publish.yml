name: Publish USC website
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Read private website source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bryanrg22/openai-student-collective-usc
          ref: main
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          persist-credentials: false
          path: source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check for new source
        id: source
        working-directory: source
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {appendFileSync} from 'node:fs';
          const sha=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const r=await fetch('https://openai-student-collective-usc.azure-bream-1113.chatgpt.site/__deploy/status');
          if(!r.ok)throw Error('Unable to inspect live release');
          const live=await r.json();
          appendFileSync(process.env.GITHUB_OUTPUT,`sha=${sha}\nchanged=${live.version!==sha}\n`);
          console.log(live.version===sha?'Website is current.':'A new website build is available.');
          JS
      - name: Test source
        if: steps.source.outputs.changed == 'true'
        working-directory: source
        run: npm test
      - name: Build website
        if: steps.source.outputs.changed == 'true'
        working-directory: source
        run: npm run build
      - name: Publish and verify
        if: steps.source.outputs.changed == 'true'
        working-directory: source
        run: node scripts/publish-site.mjs
        env:
          SITES_PUBLISH_KEY: ${{ secrets.SITES_PUBLISH_KEY }}
          SITE_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SITE_SOURCE_REPOSITORY: bryanrg22/openai-student-collective-usc
      - name: Record verified release and keep the schedule active
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          node --input-type=module <<'JS'
          const url=`https://api.github.com/repos/${process.env.PIPELINE_REPOSITORY}/contents/last-deploy.json`;
          const headers={Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          const previous=await fetch(url,{headers});if(!previous.ok&&previous.status!==404)throw Error('Cannot read publication record');
          const file=previous.ok?await previous.json():null;
          const record=file?JSON.parse(Buffer.from(file.content,'base64').toString()):null;
          if(record?.version===process.env.SOURCE_SHA&&Date.now()-Date.parse(record.checkedAt)<7*86400000){console.log('Publication record is current.');process.exit(0);}
          const data={version:process.env.SOURCE_SHA,checkedAt:new Date().toISOString()};
          const response=await fetch(url,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({message:'Record verified website publication',content:Buffer.from(JSON.stringify(data,null,2)+'\n').toString('base64'),...(file?{sha:file.sha}:{})})});
          if(!response.ok)throw Error(`Cannot save publication record (${response.status})`);
          console.log('Verified website publication recorded.');
          JS
